# queries disponibles, se identifican por nombre

# postgres
drop.table=DROP TABLE IF EXISTS users
create.table=CREATE TABLE IF NOT EXISTS users (id SERIAL PRIMARY KEY, name VARCHAR(100))

# mysql (usa AUTO_INCREMENT en vez de SERIAL)
create.table.mysql=CREATE TABLE IF NOT EXISTS users (id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(100))

find.all.users=SELECT id, name FROM users
find.user.by.id=SELECT id, name FROM users WHERE id = ?
insert.user=INSERT INTO users (name) VALUES (?)
ping=SELECT 1
