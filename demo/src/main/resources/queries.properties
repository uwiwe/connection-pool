# Queries predefinidas — los callers usan la clave, nunca el SQL directamente

create.table   = CREATE TABLE IF NOT EXISTS users (id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(100))
find.all.users = SELECT id, name FROM users
find.user.by.id = SELECT id, name FROM users WHERE id = ?
insert.user    = INSERT INTO users (name) VALUES (?)
ping           = SELECT 1
